[Service]
EnvironmentFile=/home/piholeadmin/.config/solar-heartbeats/solar.env
ExecStartPre=-/usr/bin/curl --fail --silent --show-error --max-time 10 ${HC_HEALTH_CHECK}/start
ExecStartPost=-/usr/bin/curl --fail --silent --show-error --max-time 10 ${HC_HEALTH_CHECK}
ExecStopPost=-/bin/sh -c 'if [ "$$SERVICE_RESULT" != success ]; then /usr/bin/curl --fail --silent --show-error --max-time 10 "$${HC_HEALTH_CHECK}/fail"; fi'
