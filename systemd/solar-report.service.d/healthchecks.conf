[Service]
EnvironmentFile=/home/piholeadmin/.config/solar-heartbeats/solar.env
ExecStartPre=-/usr/bin/curl --fail --silent --show-error --max-time 10 ${HC_REPORT}/start
ExecStartPost=-/usr/bin/curl --fail --silent --show-error --max-time 10 ${HC_REPORT}
ExecStopPost=-/bin/sh -c 'if [ "$$SERVICE_RESULT" != success ]; then /usr/bin/curl --fail --silent --show-error --max-time 10 "$${HC_REPORT}/fail"; fi'
